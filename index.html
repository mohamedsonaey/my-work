<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>نظام إدارة الأعمال</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <style>
      :root {
        --p: #0b746b;
        --p2: #123d3a;
        --bg: #f5f7f8;
        --b: #e5e9ed;
        --t: #182b2a;
        --m: #758381;
        --ok: #16845b;
        --er: #c34b4b;
        --surface: #ffffff;
        --soft: #e8f5f1;
        --shadow: 0 8px 28px rgba(20, 48, 44, 0.045);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: var(--bg);
        color: var(--t);
        line-height: 1.7;
        letter-spacing: -0.1px;
      }
      #app {
        display: flex;
        min-height: 100vh;
      }
      nav {
        width: 258px;
        background: #fff;
        border-left: 1px solid var(--b);
        padding: 22px 14px;
        flex-shrink: 0;
        box-shadow: 5px 0 24px rgba(18, 61, 58, 0.025);
      }
      nav h1 {
        color: var(--p2);
        font-size: 18px;
        font-weight: 800;
        margin: 0 7px 4px;
        padding: 4px 4px 14px;
        border-bottom: 1px solid #edf0f1;
      }
      .nav-subtitle {
        display: block;
        color: #8b9997;
        font-size: 11px;
        font-weight: 500;
        margin: 0 11px 22px;
      }
      .nav-caption {
        color: #9aa5a3;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.7px;
        padding: 12px 12px 6px;
      }
      nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        color: #687976;
        cursor: pointer;
        margin-bottom: 4px;
        font-size: 13px;
        font-weight: 600;
        transition:
          background 0.18s ease,
          color 0.18s ease,
          transform 0.18s ease;
      }
      nav a::before {
        content: "";
        width: 6px;
        height: 6px;
        flex: 0 0 6px;
        border-radius: 50%;
        background: #c6d1cf;
      }
      nav a:hover {
        background: #f3f8f6;
        color: var(--p);
        transform: translateX(-2px);
      }
      nav a.on {
        background: var(--soft);
        color: var(--p);
        box-shadow: inset -3px 0 var(--p);
      }
      nav a.on::before {
        background: var(--p);
        box-shadow: 0 0 0 4px #cfe9e2;
      }
      .nav-group {
        margin: 3px 0;
      }
      .nav-group summary {
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        padding: 10px 12px;
        border-radius: 10px;
        color: #687976;
        font-size: 13px;
        font-weight: 700;
      }
      .nav-group summary::-webkit-details-marker {
        display: none;
      }
      .nav-group summary::after {
        content: "⌄";
        color: #9aa5a3;
        font-size: 16px;
      }
      .nav-group[open] summary::after {
        content: "⌃";
      }
      .nav-group summary:hover {
        background: #f6f8f8;
        color: var(--p);
      }
      .nav-group .nav-children {
        padding: 3px 7px 6px 0;
      }
      .nav-group .nav-children a {
        font-size: 12px;
        padding: 8px 10px;
        font-weight: 500;
      }
      nav a#out {
        margin-top: 20px;
        border-top: 1px solid #edf0f1;
        border-radius: 0;
        padding-top: 16px;
        color: #b64d4d;
      }
      nav a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #2aa3a3;
        outline-offset: 1px;
      }
      main {
        flex: 1;
        padding: 34px clamp(18px, 3vw, 48px);
        min-width: 0;
        max-width: 1800px;
      }
      h2 {
        margin: 0 0 7px;
        font-size: clamp(22px, 2vw, 28px);
        font-weight: 800;
        letter-spacing: -0.6px;
        color: var(--p2);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--b);
        border-radius: 16px;
        padding: 20px;
        box-shadow: var(--shadow);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin: 14px 0;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--b);
        border-radius: 16px;
        padding: 18px 20px;
        border-right: 3px solid var(--p);
        box-shadow: var(--shadow);
      }
      .stat b {
        display: block;
        font-size: clamp(25px, 2.5vw, 32px);
        font-weight: 800;
        letter-spacing: -0.6px;
        color: var(--p);
      }
      .stat span {
        font-size: 13px;
        color: var(--m);
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        padding: 8px 10px;
        text-align: right;
        border-bottom: 1px solid var(--b);
        white-space: nowrap;
      }
      th {
        background: #f6f8f8;
        color: #697b78;
        font-weight: 600;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--b);
        border-radius: 10px;
        background: #fff;
        color: var(--t);
        min-height: 42px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--m);
        margin: 10px 0 3px;
      }
      .btn {
        background: var(--p);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 17px;
        cursor: pointer;
        font-weight: 700;
        transition:
          transform 0.15s ease,
          filter 0.15s ease;
      }
      .btn:hover {
        filter: brightness(0.96);
        transform: translateY(-1px);
      }
      .btn.s {
        background: #e8f5f1;
        color: var(--p2);
        padding: 7px 12px;
        font-size: 12px;
      }
      .bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0;
        align-items: center;
      }
      .bar input,
      .bar select {
        width: auto;
        flex: 1;
        min-width: 150px;
      }
      dialog {
        border: 0;
        border-radius: 10px;
        padding: 18px;
        width: min(580px, 94vw);
        max-height: 92vh;
      }
      dialog::backdrop {
        background: #0a3a3e88;
      }
      .m {
        color: var(--m);
      }
      .err {
        color: var(--er);
      }
      #toast {
        position: fixed;
        bottom: 16px;
        left: 16px;
        padding: 10px 16px;
        border-radius: 6px;
        color: #fff;
        display: none;
        max-width: 85vw;
        z-index: 9;
      }
      .login {
        max-width: 360px;
        margin: 12vh auto;
        padding: 22px;
      }
      @media (max-width: 780px) {
        #app {
          flex-direction: column;
        }
        nav {
          width: auto;
          border-left: 0;
          border-bottom: 1px solid var(--b);
          padding: 12px;
          display: block;
        }
        nav h1 {
          font-size: 16px;
          padding-bottom: 6px;
          border: 0;
        }
        .nav-subtitle {
          margin-bottom: 10px;
        }
        nav > a[data-k] {
          display: inline-flex;
          white-space: nowrap;
          margin: 2px;
          padding: 8px 10px;
        }
        .nav-caption {
          padding: 5px 8px;
        }
        .nav-group {
          display: inline-block;
          vertical-align: top;
          min-width: 140px;
        }
        .nav-group summary {
          padding: 8px 10px;
        }
        .nav-group .nav-children {
          position: relative;
          background: #fff;
          border: 1px solid var(--b);
          border-radius: 10px;
          padding: 6px;
          box-shadow: var(--shadow);
          z-index: 5;
        }
        .nav-group .nav-children a {
          white-space: normal;
        }
        nav a#out {
          display: inline-flex;
          margin: 4px;
          padding: 8px 10px;
          border: 0;
        }
        main {
          padding: 22px 14px 32px;
        }
        .card,
        .stat {
          border-radius: 13px;
        }
        #tbl {
          padding: 0 4px;
        }
        .bar input,
        .bar select {
          max-width: none;
        }
      }

      /* ===== تحسينات واجهة المستخدم ===== */
      :root {
        --p: #0f625f;
        --p2: #103f40;
        --bg: #f4f7f7;
        --b: #e1e9e8;
        --t: #172f30;
        --m: #708382;
        --ok: #16845b;
        --er: #c23d4b;
        --surface: #ffffff;
        --soft: #eaf5f3;
        --shadow: 0 10px 28px rgba(16, 63, 64, 0.055);
      }
      body {
        background:
          radial-gradient(ellipse at top right, #e7f3f1 0, transparent 34%),
          var(--bg);
        color: var(--t);
        line-height: 1.7;
      }
      #app {
        min-height: 100vh;
        gap: 0;
      }
      nav {
        width: 258px;
        background: linear-gradient(180deg, #103f40 0%, #0b3032 100%);
        padding: 22px 14px;
        box-shadow: 8px 0 28px rgba(9, 48, 50, 0.08);
        position: relative;
        z-index: 2;
      }
      nav h1 {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-size: 17px;
        font-weight: 800;
        margin: 2px 8px 26px;
        letter-spacing: -0.3px;
      }
      nav h1::before {
        content: "ب";
        display: inline-grid;
        place-items: center;
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        border-radius: 13px;
        background: #d2eee8;
        color: #103f40;
        font-size: 21px;
        font-weight: 900;
      }
      nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 43px;
        padding: 10px 12px;
        border-radius: 11px;
        color: #c1d9d6;
        margin: 3px 0;
        font-size: 13.5px;
        font-weight: 600;
        transition:
          background 0.18s ease,
          color 0.18s ease,
          transform 0.18s ease;
        text-decoration: none;
      }
      nav a::before {
        content: "";
        width: 7px;
        height: 7px;
        flex: 0 0 7px;
        border-radius: 3px;
        background: #6e9d99;
        box-shadow: 0 0 0 4px rgba(110, 157, 153, 0.12);
      }
      nav a:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        transform: translateX(-2px);
      }
      nav a.on {
        background: linear-gradient(100deg, #176e69, #145b59);
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
      }
      nav a.on::before {
        background: #b9eee2;
        box-shadow: 0 0 0 4px rgba(185, 238, 226, 0.14);
      }
      nav a#out {
        margin-top: 22px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 0 0 10px 10px;
        padding-top: 16px;
        color: #f0c7c7;
      }
      nav a#out::before {
        background: #dc8989;
      }
      main {
        flex: 1;
        min-width: 0;
        padding: 30px clamp(16px, 3vw, 42px);
        max-width: 1680px;
        margin: 0 auto;
      }
      h2 {
        color: var(--p2);
        font-size: clamp(21px, 2vw, 27px);
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0;
      }
      main > h2 {
        margin-bottom: 18px;
      }
      .bar {
        gap: 10px;
        margin: 15px 0;
      }
      .bar h2 {
        margin-inline-end: auto;
      }
      .card,
      .stat {
        border: 1px solid var(--b);
        border-radius: 15px;
        box-shadow: var(--shadow);
      }
      .dashboard-total {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        background: linear-gradient(120deg, #fff, #f0f8f6);
      }
      .dashboard-total b {
        color: var(--p);
        font-size: 24px;
        font-weight: 800;
      }
      .dashboard-total span {
        max-width: 680px;
        font-size: 13px;
        line-height: 1.8;
      }
      .card {
        padding: 20px;
      }
      .grid {
        gap: 14px;
        margin: 18px 0;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      }
      .stat {
        padding: 18px;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }
      .stat:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(16, 63, 64, 0.09);
      }
      .stat::after {
        content: "";
        position: absolute;
        left: -17px;
        bottom: -25px;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: var(--soft);
      }
      .stat b {
        font-size: clamp(25px, 2.3vw, 32px);
        line-height: 1.35;
        font-weight: 800;
        color: var(--p);
        position: relative;
        z-index: 1;
      }
      .stat span {
        display: block;
        font-size: 13px;
        color: var(--m);
        font-weight: 600;
        position: relative;
        z-index: 1;
      }
      .tw {
        border-radius: 13px;
      }
      table {
        font-size: 13.5px;
      }
      th,
      td {
        padding: 12px 13px;
        border-bottom: 1px solid #edf1f0;
      }
      th {
        background: #f2f7f6;
        color: #55706e;
        font-size: 12px;
        font-weight: 800;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover,
      table tr:hover td {
        background: #fbfdfd;
      }
      input,
      select,
      textarea {
        border-color: #d8e4e2;
        border-radius: 9px;
        padding: 10px 12px;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #4c9d94;
        box-shadow: 0 0 0 3px rgba(76, 157, 148, 0.13);
      }
      label {
        color: #526b69;
        font-size: 13px;
        font-weight: 700;
        margin: 13px 0 5px;
      }
      .btn {
        border-radius: 9px;
        padding: 10px 16px;
        font-weight: 700;
        background: linear-gradient(135deg, #176e69, #0f5257);
        box-shadow: 0 4px 10px rgba(15, 82, 87, 0.12);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          opacity 0.15s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 7px 15px rgba(15, 82, 87, 0.18);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn.s {
        background: #eaf3f2;
        color: #245b59;
        box-shadow: none;
        border: 1px solid #dce9e7;
      }
      .btn.s:hover {
        background: #dcecea;
      }
      dialog {
        color: var(--t);
        box-shadow: 0 24px 80px rgba(5, 34, 35, 0.25);
        border: 1px solid #dfe9e7;
        border-radius: 18px;
        padding: 24px;
      }
      dialog h2 {
        margin-bottom: 12px;
      }
      dialog::backdrop {
        background: rgba(9, 39, 40, 0.52);
        backdrop-filter: blur(3px);
      }
      .m {
        color: var(--m);
      }
      .err {
        color: var(--er);
      }
      #toast {
        border-radius: 11px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
        font-size: 13px;
        font-weight: 700;
      }
      .login {
        max-width: 410px;
        margin: 9vh auto;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 24px 70px rgba(16, 63, 64, 0.12);
      }
      .login h2 {
        margin-bottom: 20px;
      }
      .login .btn {
        margin-top: 10px;
        min-height: 44px;
      }
      @media (min-width: 781px) {
        #app {
          align-items: stretch;
        }
        nav {
          min-height: 100vh;
          position: sticky;
          top: 0;
          height: 100vh;
          overflow-y: auto;
        }
      }
      @media (max-width: 780px) {
        #app {
          flex-direction: column;
        }
        nav {
          width: 100%;
          display: flex;
          align-items: center;
          overflow-x: auto;
          gap: 5px;
          padding: 8px 10px;
          position: sticky;
          top: 0;
          box-shadow: 0 6px 20px rgba(9, 48, 50, 0.12);
        }
        nav h1 {
          display: none;
        }
        nav a {
          min-height: 38px;
          padding: 8px 12px;
          margin: 0;
          flex: 0 0 auto;
          font-size: 12px;
        }
        nav a::before {
          width: 5px;
          height: 5px;
          flex-basis: 5px;
          box-shadow: none;
        }
        nav a#out {
          margin-top: 0;
          border-top: 0;
          padding-top: 8px;
        }
        main {
          padding: 20px 14px 30px;
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }
        .stat {
          padding: 13px;
          border-radius: 12px;
        }
        .stat b {
          font-size: 24px;
          overflow-wrap: anywhere;
        }
        .stat span {
          font-size: 11.5px;
        }
        .card {
          padding: 14px;
        }
        .bar input,
        .bar select {
          min-width: 125px;
        }
        dialog {
          padding: 18px;
        }
      }
      @media (max-width: 390px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
        .stat b {
          font-size: 21px;
        }
      }

      /* Dashboard refresh: cleaner hierarchy, fewer visible fields */
      .dash-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .dash-head h2 {
        font-size: clamp(26px, 3vw, 34px);
      }
      .eyebrow {
        margin: 0 0 5px;
        color: #41837d;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .dash-head .m,
      .section-heading .m {
        margin: 5px 0 0;
        font-size: 13px;
      }
      .update-time {
        background: #fff;
        border: 1px solid var(--b);
        color: var(--m);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 11px;
      }
      .dashboard-stats {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin: 0 0 28px;
      }
      .dashboard-stats .stat {
        min-height: 142px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .dashboard-stats .stat b {
        font-size: clamp(20px, 2vw, 29px);
        margin: 8px 0 3px;
        overflow-wrap: anywhere;
      }
      .dashboard-stats .stat small {
        color: var(--m);
        font-size: 11px;
        position: relative;
        z-index: 1;
      }
      .dashboard-section {
        margin-top: 26px;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 13px;
      }
      .section-heading h3 {
        margin: 0;
        color: var(--p2);
        font-size: 17px;
      }
      .quick-actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .quick-action {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
        padding: 16px;
        text-align: right;
        border: 1px solid var(--b);
        border-radius: 14px;
        background: #fff;
        color: var(--t);
        cursor: pointer;
        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          box-shadow 0.16s ease;
      }
      .quick-action:hover {
        transform: translateY(-2px);
        border-color: #a9cfca;
        box-shadow: var(--shadow);
      }
      .quick-icon {
        display: grid;
        place-items: center;
        width: 39px;
        height: 39px;
        flex: 0 0 39px;
        border-radius: 12px;
        background: #e8f4f1;
        color: var(--p);
        font-size: 21px;
        font-weight: 800;
      }
      .quick-action b,
      .attention-item b {
        display: block;
        font-size: 13px;
      }
      .quick-action small,
      .attention-item small {
        display: block;
        margin-top: 2px;
        color: var(--m);
        font-size: 11px;
        font-weight: 400;
      }
      .quick-arrow {
        margin-inline-start: auto;
        color: #7c9995;
        font-size: 17px;
      }
      .attention-list {
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--b);
        border-radius: 14px;
      }
      .attention-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 14px 16px;
        border: 0;

      // ---------- الدخول ----------
      function login(msg) {
        $("#app").innerHTML = `<div class="card login"><h2>تسجيل الدخول</h2>
  <label>البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="username" required>
<label>كلمة المرور</label><input id="pw" type="password" dir="ltr" autocomplete="current-password" required>
<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" onchange="document.getElementById('pw').type=this.checked?'text':'password'"> إظهار كلمة المرور</label>
  <p class="err" id="lm">${esc(msg || "")}</p><button class="btn" id="lg" style="width:100%">دخول</button></div>`;
        let busy = false;
        const go_ = async () => {
          if (busy) return;
          const email = $("#em").value.trim();
          const password = $("#pw").value;
          if (!email || !password) {
            $("#lm").textContent = "اكتب البريد الإلكتروني وكلمة المرور الأول.";
            return;
          }
          busy = true;
          const btn = $("#lg");
          btn.disabled = true;
          btn.textContent = "جاري التحقق…";
          $("#lm").textContent = "";
          try {
            const { error } = await db.auth.signInWithPassword({
              email,
              password,
            });
            if (error) {
              const msg = String(error.message || "");
              if (/invalid login credentials/i.test(msg))
                $("#lm").textContent =
                  "الإيميل أو كلمة المرور غير صحيحة. راجع بيانات الحساب أو أعد تعيين كلمة المرور.";
              else if (/email not confirmed/i.test(msg))
                $("#lm").textContent =
                  "لازم تأكد البريد الإلكتروني من رسالة Supabase الأول.";
              else if (/fetch|network|failed to fetch/i.test(msg))
                $("#lm").textContent =
                  "تعذر الاتصال بـ Supabase. راجع الإنترنت وإعدادات المشروع.";
              else $("#lm").textContent = "تعذر تسجيل الدخول: " + msg;
              return;
            }
            await boot();
          } catch (e) {
            $("#lm").textContent =
              "حصل خطأ أثناء تسجيل الدخول: " + (e?.message || "خطأ غير معروف");
          } finally {
            busy = false;
            if ($("#lg")) {
              $("#lg").disabled = false;
              $("#lg").textContent = "دخول";
            }
          }
        };
        $("#lg").onclick = go_;
        $("#pw").onkeydown = (e) => {
          if (e.key === "Enter") go_();
        };
      }
      async function boot() {
        if (SUPABASE_URL.startsWith("PASTE"))
          return ($("#app").innerHTML =
            '<p class="card err">عدّل SUPABASE_URL و SUPABASE_ANON_KEY في أعلى الملف أولًا.</p>');
        const {
          data: { session },
        } = await db.auth.getSession();
        if (!session) return login();
        const { data: a, error: adminError } = await db
          .from("admins")
          .select("user_id")
          .eq("user_id", session.user.id);
        if (adminError)
          return login(
            "تم تسجيل الدخول لكن تعذر التحقق من صلاحية الأدمن: " +
              adminError.message,
          );
        if (!a?.length) {
          await db.auth.signOut();
          return login("هذا الحساب غير مصرح له بالدخول.");
        }
        await loadL();
        $("#app").innerHTML =
          `<nav><h1>مساحة العمل</h1><span class="nav-subtitle">إدارة أعمالك من مكان واحد</span>${NAV_GROUPS.map((group, i) => (i === 0 ? `<div class="nav-caption">${group.title}</div>${group.items.map(([k, l]) => `<a data-k="${k}" tabindex="0">${l}</a>`).join("")}` : `<details class="nav-group"><summary>${group.title}</summary><div class="nav-children">${group.items.map(([k, l]) => `<a data-k="${k}" tabindex="0">${l}</a>`).join("")}</div></details>`)).join("")}<a id="out" tabindex="0">تسجيل الخروج</a></nav><main></main><dialog id="dlg"></dialog>`;
        document
          .querySelectorAll("nav a[data-k]")
          .forEach((a) => (a.onclick = () => go(a.dataset.k)));
        $("#out").onclick = async () => {
          await db.auth.signOut();
          boot();
        };
        go("dash");
      }
      function go(k) {
        document
          .querySelectorAll("nav a[data-k]")
          .forEach((a) => a.classList.toggle("on", a.dataset.k === k));
        k === "dash"
          ? dash()
          : k === "settings"
            ? settings()
            : k === "commissions"
              ? commissions()
              : k === "collection_summary"
                ? collectionSummary()
                : k === "followups"
                  ? followups()
                  : k === "challenge_leaderboard"
                    ? challengeLeaderboard()
                    : list(k);
      }

      // ---------- لوحة التحكم ----------
      async function dash() {
        const M = $("main");
        M.innerHTML = '<p class="m">جاري تحميل لوحة التحكم…</p>';
        const [pr, pay, po, ex, pc, su] = await Promise.all([
          db
            .from("projects")
            .select(
              "id,execution_status,agreed_price,marketer_id,marketer_rate_applied,leader_rate_applied",
            ),
          db.from("client_payments").select("amount,project_id"),
          db.from("payouts").select("amount,kind,recipient_id"),
          db.from("business_expenses").select("amount"),
          db.from("project_costs").select("amount"),
          db
            .from("service_subscriptions")
            .select("id,status,next_due_date,amount"),
        ]);
        const failed = [pr, pay, po, ex, pc, su].find((x) => x.error);
        if (failed)
          return (M.innerHTML = `<h2>لوحة التحكم</h2><p class="err">${esc(failed.error.message)}<br>لو دي أول مرة تفتح النسخة الجديدة، شغّل ملف SQL المرفق في Supabase الأول.</p>`);
        const p = pr.data || [],
          payments = pay.data || [],
          payouts = po.data || [],
          expenses = ex.data || [],
          projectCosts = pc.data || [],
          subs = su.data || [];
        const n = (a, f) => a.filter(f).length;
        const agreed = p
          .filter((x) => x.execution_status !== "cancelled")
          .reduce((a, x) => a + Number(x.agreed_price || 0), 0);
        const collected = payments.reduce(
          (a, x) => a + Number(x.amount || 0),
          0,
        );
        const paidOut = payouts.reduce((a, x) => a + Number(x.amount || 0), 0);
        const spent = expenses.reduce((a, x) => a + Number(x.amount || 0), 0);
        const costTotal = projectCosts.reduce(
          (a, x) => a + Number(x.amount || 0),
          0,
        );
        const balance = collected - spent - costTotal - paidOut;
        const dueSubs = subs.filter(
          (x) =>
            x.status === "active" &&
            x.next_due_date &&
            x.next_due_date <= today,
        );
        const overdue = n(
          L.clients,
          (x) =>
            x.next_followup_at &&
            x.next_followup_at <= today &&
            !["converted", "not_interested", "lost"].includes(x.stage),
        );
        const activeProjects = n(
          p,
          (x) =>
            x.execution_status === "in_progress" ||
            x.execution_status === "waiting_client_info" ||
            x.execution_status === "waiting_client_review" ||
            x.execution_status === "needs_revisions",
        );
        const S = [
          [
            "إجمالي التحصيل",
            collected.toLocaleString("ar-EG") + " ج.م",
            "المبالغ المسجلة من العملاء",
          ],
          [
            "قيمة الاتفاقات",
            agreed.toLocaleString("ar-EG") + " ج.م",
            "المشاريع غير الملغاة",
          ],
          [
            "صافي النقدية",
            balance.toLocaleString("ar-EG") + " ج.م",
            "بعد التكاليف والمدفوعات المسجلة",
          ],
          ["مشاريع نشطة", activeProjects, "قيد التنفيذ أو انتظار العميل"],
        ];

      async function commissions() {
        const M = $("main");
        M.innerHTML =
          '<h2>العمولات والمستحقات</h2><p class="m">جاري الحساب…</p>';
        const [pr, pa, po, ma] = await Promise.all([
          db
            .from("projects")
            .select(
              "id,name,execution_status,agreed_price,marketer_id,marketer_rate_applied,leader_rate_applied",
            ),
          db.from("client_payments").select("project_id,amount"),
          db.from("payouts").select("recipient_id,kind,amount"),
          db.from("marketers").select("id,name,account_type,leader_id,status"),
        ]);
        const bad = [pr, pa, po, ma].find((x) => x.error);
        if (bad)
          return (M.innerHTML = `<h2>العمولات والمستحقات</h2><p class="err">${esc(bad.error.message)}</p>`);
        const projects = pr.data || [],
          payments = pa.data || [],
          payouts = po.data || [],
          marketers = ma.data || [];
        const earned = {};
        const get = (id) =>
          earned[id] ||
          (earned[id] = {
            name: marketers.find((m) => m.id === id)?.name || "غير محدد",
            earned: 0,
            paid: 0,
          });
        for (const p of projects) {
          if (p.execution_status === "cancelled" || !p.marketer_id) continue;
          const collected = payments
            .filter((x) => x.project_id === p.id)
            .reduce((s, x) => s + Number(x.amount || 0), 0);
          const marketer = marketers.find((m) => m.id === p.marketer_id);
          const mr = Number(p.marketer_rate_applied || 0);
          if (mr > 0) get(p.marketer_id).earned += (collected * mr) / 100;
          const lr = Number(p.leader_rate_applied || 0);
          if (lr > 0 && marketer?.leader_id)
            get(marketer.leader_id).earned += (collected * lr) / 100;
        }
        for (const x of payouts) {
          if (x.kind === "commission")
            get(x.recipient_id).paid += Number(x.amount || 0);
        }
        const rows = Object.entries(earned)
          .map(([id, x]) => ({ id, ...x, remaining: x.earned - x.paid }))
          .sort((a, b) => b.remaining - a.remaining);
        const totalEarned = rows.reduce((s, x) => s + x.earned, 0),
          totalPaid = rows.reduce((s, x) => s + x.paid, 0),
          totalDue = rows.reduce((s, x) => s + x.remaining, 0);
        M.innerHTML = `<h2>العمولات والمستحقات</h2><div class="grid"><div class="stat"><span>عمولات مستحقة حسب التحصيل</span><b>${totalEarned.toLocaleString("ar-EG", { maximumFractionDigits: 2 })} ج.م</b></div><div class="stat"><span>مدفوع كعمولات</span><b>${totalPaid.toLocaleString("ar-EG", { maximumFractionDigits: 2 })} ج.م</b></div><div class="stat"><span>المتبقي التقريبي</span><b>${totalDue.toLocaleString("ar-EG", { maximumFractionDigits: 2 })} ج.م</b></div></div><p class="m">الحساب يعتمد على المبالغ المسجلة في client_payments ونسب المشروع المحفوظة، ويخصم فقط المدفوعات التي نوعها commission. راجع نوع المدفوعات القديمة قبل الاعتماد النهائي.</p><div class="card tw"><table><thead><tr><th>المسوق/الليدر</th><th>العمولة المكتسبة</th><th>العمولة المدفوعة</th><th>المتبقي</th></tr></thead><tbody>${rows.map((x) => `<tr><td>${esc(x.name)}</td><td>${x.earned.toLocaleString("ar-EG", { maximumFractionDigits: 2 })}</td><td>${x.paid.toLocaleString("ar-EG", { maximumFractionDigits: 2 })}</td><td>${x.remaining.toLocaleString("ar-EG", { maximumFractionDigits: 2 })}</td></tr>`).join("") || '<tr><td colspan="4">لا توجد عمولات محسوبة بعد. تأكد من وجود تحصيلات ونسب محفوظة في المشاريع.</td></tr>'}</tbody></table></div>`;
      }

      // ---------- القوائم العامة ----------
      async function list(key) {

  <div class="bar"><input id="q" placeholder="بحث…" aria-label="بحث">${c.filt ? `<select id="fl" aria-label="تصفية"><option value="">كل الحالات</option>${c.filt[1].map(([a, b]) => `<option value="${a}">${b}</option>`).join("")}</select>` : ""}</div><div class="card" id="tbl"></div>`;

              key,
              ROWS.find((r) => r.id === b.dataset.e),
            );
          if (b.dataset.a) rates(b.dataset.a);
        };
        tbl(key);
      }
      function tbl(key) {
        const c = R[key],
          q = $("#q").value.trim().toLowerCase(),
          fv = $("#fl")?.value;
        const show = (fm, v) => String(fm ? fm(v) : (v ?? ""));
        const rows = ROWS.filter(
          (r) =>
            (!fv || r[c.filt[0]] === fv) &&
            (!q ||
              c.cols.some(([k, , fm]) =>
                show(fm, r[k]).toLowerCase().includes(q),
              )),
        );
        $("#tbl").innerHTML = rows.length
          ? `<div class="tw"><table><tr>${c.cols.map((x) => `<th>${x[1]}</th>`).join("")}${c.ro ? "" : "<th></th>"}</tr>${rows.map((r) => `<tr>${c.cols.map(([k, , fm]) => `<td>${esc(show(fm, r[k]))}</td>`).join("")}${c.ro ? "" : `<td><button class="btn s" data-e="${r.id}">تعديل</button>${c.act ? ` <button class="btn s" data-a="${r.id}">النسب</button>` : ""}</td>`}</tr>`).join("")}</table></div>`
          : '<p class="m">لا توجد بيانات مطابقة. اضغط «إضافة» لإنشاء أول سجل.</p>';
      }

      // ---------- النماذج ----------
      function inp(f, v) {
        const id = "f_" + f.k,
          val = v ?? f.def ?? "";
        if (f.ty === "select")
          return `<select id="${id}"><option value="">—</option>${f
            .o()
            .map(
              ([a, b]) =>
                `<option value="${esc(a)}"${a === val ? " selected" : ""}>${esc(b)}</option>`,
            )
            .join("")}</select>`;
        if (f.ty === "bool")
          return `<select id="${id}"><option value="true"${val !== false ? " selected" : ""}>نعم</option><option value="false"${val === false ? " selected" : ""}>لا</option></select>`;
        if (f.ty === "textarea" || f.ty === "lines")
          return `<textarea id="${id}" rows="3">${esc(val)}</textarea>`;
        return `<input id="${id}" type="${f.ty || "text"}" value="${esc(val)}"${f.ty === "number" ? ' step="any"' : ""}>`;
      }
      function read(c) {
        const o = {},
          miss = [];
        for (const f of c.f) {
          let v = $("#f_" + f.k).value;
          if (f.ty === "bool") v = v === "true";
          else if (f.ty === "lines")
            v = v
              .split("\n")
              .map((s) => s.trim())
              .filter(Boolean)
              .map((s) => ({ key: s, label: s, type: "text" }));
          else if (v.trim() === "") {
            v = null;
            if (f.req) miss.push(f.l);
          } else if (f.ty === "number") v = Number(v);
          o[f.k] = v;
        }
        if (miss.length) {
          toast("حقول مطلوبة: " + miss.join("، "));
          return null;
        }
        return o;
      }
      const gcf = () => {
        const o = { ...CD };
        document
          .querySelectorAll("#cf input")
          .forEach((i) => (o[i.dataset.k] = i.value));
        return o;
      };
      function drawCF() {
        const s = L.service_types.find(
          (x) => x.id === $("#f_service_type_id").value,
        );
        $("#cf").innerHTML = (s?.custom_fields || [])
          .map(
            (f) =>
              `<label>${esc(f.label)}</label><input data-k="${esc(f.key)}" value="${esc(CD[f.key] ?? "")}">`,
          )
          .join("");
      }
      function openForm(key, row) {
        const c = R[key];
        CD = row?.custom_details || {};
        const renderField = (f) => {
          let v = row ? row[f.k] : undefined;
          if (f.ty === "lines") v = (v || []).map((x) => x.label).join("\n");
          if (f.ty === "datetime-local" && v)
            v = new Date(v)
              .toLocaleString("sv-SE")
              .replace(" ", "T")
              .slice(0, 16);
          return `<div class="form-field"><label>${f.l}${f.req ? " *" : ""}</label>${inp(f, v)}</div>`;
        };
        const requiredFields = c.f.filter((f) => f.req);
        const optionalFields = c.f.filter((f) => !f.req);
        const visibleOptional = [];
        const extraOptional = optionalFields;
        $("#dlg").innerHTML =
          `<div class="form-title"><p class="eyebrow">${row ? "تعديل بيانات" : "سجل جديد"}</p><h2>${row ? "تعديل" : "إضافة"} — ${c.t}</h2><p class="m">املأ البيانات الأساسية، والتفاصيل الإضافية اختيارية.</p></div><div class="form-fields">${requiredFields.map(renderField).join("")}${visibleOptional.map(renderField).join("")}</div>${extraOptional.length ? `<details class="extra-fields"><summary>+ تفاصيل إضافية <span>${extraOptional.length} حقول اختيارية — افتحها عند الحاجة</span></summary><div class="form-fields extra-grid">${extraOptional.map(renderField).join("")}</div></details>` : ""}${key === "projects" ? '<div id="cf"></div>' : ""}<div class="bar form-actions"><button class="btn" id="sv">حفظ</button><button class="btn s" id="cx">إلغاء</button></div>`;
        $("#cx").onclick = () => $("#dlg").close();
        $("#sv").onclick = () => save(key, row);
        if (key === "projects") {
          drawCF();
          $("#f_service_type_id").onchange = () => {
            CD = gcf();
            drawCF();
          };
        }
        $("#dlg").showModal();
      }
      async function save(key, row) {
        const c = R[key],
          o = read(c);
        if (!o) return;
        if (
          [
            "client_payments",
            "payouts",
            "business_expenses",
            "project_costs",
            "service_subscriptions",
            "individual_rewards",
            "challenge_awards",
          ].includes(key) &&
          Number(o.amount ?? -1) < 0
        )
          return toast("القيمة لازم تكون صفر أو أكبر.");
        if (key === "sales_challenges" && Number(o.prize_amount ?? -1) < 0)
          return toast("قيمة الجائزة لازم تكون صفر أو أكبر.");
        if (key === "sales_challenges" && o.start_date > o.end_date)
          return toast("تاريخ بداية التحدي لازم يكون قبل نهايته.");
        if (key === "individual_rewards" && o.start_date > o.end_date)
          return toast("بداية فترة المكافأة لازم تكون قبل نهايتها.");
        if (
          key === "service_subscriptions" &&
          o.end_date &&
          o.start_date > o.end_date
        )
          return toast("تاريخ نهاية الاشتراك لازم يكون بعد البداية.");
        if (key === "projects") o.custom_details = gcf();
        if (key === "marketers" && o.account_type !== "team_member")
          o.leader_id = null;
        if (
          key === "marketers" &&
          o.account_type === "team_member" &&
          !o.leader_id
        )
          return toast("المسوق التابع يحتاج ليدرًا مسؤولًا.");
        // تغيير المصدر / المسوق على سجل موجود يمر عبر دالة بسبب إلزامي
        const g =
          row &&
          {
            clients: ["referred_by", "change_client_source", "p_client"],
            projects: ["marketer_id", "change_project_marketer", "p_project"],
          }[key];
        let rpc = null;
        if (g && (o[g[0]] ?? null) !== (row[g[0]] ?? null)) {
          const why = prompt("سبب تغيير المسوق (إلزامي):");
          if (!why || !why.trim()) return toast("السبب إلزامي لتغيير المسوق.");
          rpc = [g[1], { [g[2]]: row.id, p_marketer: o[g[0]], p_reason: why }];
          delete o[g[0]];
        }
        if (key === "clients" && !row && o.phone) {
          const { data } = await db.rpc("find_possible_duplicate_clients", {
            p_phone: o.phone,
            p_name: o.name,
          });
          if (
            data?.length &&
            !confirm(
              "يوجد عميل محتمل التكرار: " +
                data.map((d) => d.name).join("، ") +
                "\nهل تريد الحفظ على أي حال؟",
            )
          )
            return;
        }
        let r = row
          ? await db.from(c.tb).update(o).eq("id", row.id)
          : await db.from(c.tb).insert(o);
        if (!r.error && rpc) r = await db.rpc(rpc[0], rpc[1]);
        if (r.error) return toast(r.error.message);
        $("#dlg").close();
        toast("تم الحفظ", 1);
        await loadL();
        list(key);
      }
      async function rates(id) {
        const r = ROWS.find((x) => x.id === id);
        const a = prompt(
          "نسبة عمولة المسوق % لهذا المشروع (فارغ = النسبة الافتراضية):",
          r.override_marketer_rate ?? "",
        );
        if (a === null) return;
        const b = prompt(
          "نسبة عمولة الليدر % (فارغ = الافتراضية):",
          r.override_leader_rate ?? "",
        );
        if (b === null) return;
        const ex = confirm(
          "هل تريد إعفاء المشروع من العمولة بالكامل؟\nموافق = إعفاء، إلغاء = لا",
        );
        const why = prompt("سبب التعديل (إلزامي):");
        if (!why || !why.trim()) return toast("السبب إلزامي.");
        const { error } = await db.rpc("update_project_rates", {
          p_project: id,
          p_marketer_rate: a === "" ? null : Number(a),
          p_leader_rate: b === "" ? null : Number(b),
          p_exempt: ex,
          p_reason: why,
        });
        error
          ? toast(error.message)
          : (toast("تم تعديل النسب", 1), list("projects"));
      }

      // ---------- إعدادات العمولات فقط ----------
      async function settings() {
        const M = $("main");
        const commissionSettings = [
          {
            key: "commission_independent",
            label: "عمولة المسوق المستقل",
            help: "النسبة الافتراضية للمسوق المستقل.",
          },
          {
            key: "commission_team_member",
            label: "عمولة عضو الفريق",
            help: "النسبة الافتراضية للمسوق التابع لليدر.",
          },
          {
            key: "commission_leader_override",
            label: "عمولة الليدر على مشاريع أعضاء فريقه",
            help: "النسبة التي يحصل عليها الليدر عن مشروع جلبه أحد أعضاء فريقه.",
          },
          {
            key: "commission_leader_personal",
            label: "عمولة الليدر على مشاريعه الشخصية",
            help: "النسبة الافتراضية عندما يجلب الليدر المشروع بنفسه.",
          },
        ];
        M.innerHTML =
          '<h2>تعديل العمولات</h2><p class="m">عدّل نسب العمولات الافتراضية فقط. التغييرات تسري على المشاريع الجديدة، أما المشاريع القديمة فتحتفظ بالنسب المسجلة وقت إنشائها.</p><p class="m">جاري تحميل النسب…</p>';
        const { data, error } = await db
          .from("settings")
          .select("key,value")
          .in(
            "key",
            commissionSettings.map((x) => x.key),
          );
        if (error)
          return (M.innerHTML = `<h2>تعديل العمولات</h2><p class="err">${esc(error.message)}</p>`);

        const values = new Map((data || []).map((x) => [x.key, x.value]));
        const missing = commissionSettings.filter((x) => !values.has(x.key));
        M.innerHTML = `<h2>تعديل العمولات</h2>
          <p class="m">عدّل نسب العمولات الافتراضية فقط. التغييرات تسري على المشاريع الجديدة، أما المشاريع القديمة فتحتفظ بالنسب المسجلة وقت إنشائها.</p>
          ${missing.length ? `<p class="err">بعض إعدادات العمولات غير موجودة في جدول settings: ${missing.map((x) => esc(x.key)).join("، ")}</p>` : ""}
          <div class="grid">${commissionSettings
            .filter((x) => values.has(x.key))
            .map((item) => {
              const raw = values.get(item.key);
              const value = typeof raw === "number" ? raw : Number(raw);
              return `<div class="card">
              <label for="commission_${item.key}"><b>${esc(item.label)}</b></label>
              <p class="m">${esc(item.help)}</p>
              <div style="display:flex;align-items:center;gap:8px;margin-top:12px">
                <input id="commission_${item.key}" type="number" min="0" max="100" step="0.01" value="${Number.isFinite(value) ? value : 0}" style="width:100%;min-width:0" dir="ltr" />
                <b>%</b>
              </div>
              <button class="btn s" data-commission-save="${item.key}" style="margin-top:12px">حفظ النسبة</button>
            </div>`;
            })
            .join("")}</div>`;

        M.onclick = async (e) => {
          const key = e.target.dataset?.commissionSave;
          if (!key) return;
          const input = $("commission_" + key);
          const value = Number(input?.value);
          if (
            !input ||
            input.value.trim() === "" ||
            !Number.isFinite(value) ||
            value < 0 ||
            value > 100
          ) {
            return toast("اكتب نسبة صحيحة من 0 إلى 100.");
          }
          const button = e.target;
          button.disabled = true;
          const { error: saveError } = await db
            .from("settings")
            .update({ value })
            .eq("key", key);
          button.disabled = false;
          if (saveError) return toast(saveError.message);
          values.set(key, value);
          toast("تم حفظ نسبة العمولة", 1);
        };
      }
      boot();
    </script>
  </body>
</html>
